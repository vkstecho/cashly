<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videos — Cashly</title>
<meta name="description" content="Latest Cashly YouTube videos — money, UPI, banking in simple Hindi.">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png"><link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<header class="nav">
  <div class="container nav-inner">
    <a class="brand" href="index.html"><span class="brand-mark"><img src="assets/cashly-icon.png" alt="Cashly" width="38" height="38"></span> Cashly</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="blog.html">Blog</a>
      <a href="calculators.html">Calculators</a>
      <a href="videos.html" class="active">Videos</a>
      <a class="btn btn-primary" href="app/">Open App</a>
    </nav>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <h1>Videos</h1>
    <p>Pulled automatically from <a href="https://www.youtube.com/@cashlybyVks" target="_blank" rel="noopener" style="color:var(--green)">@cashlybyVks</a>.</p>
  </div>
</section>

<section style="padding-top:0">
  <div class="container">
    <div class="catalog-controls" data-catalog-controls hidden>
      <label>Search <input type="search" name="videoSearch" placeholder="Find a video"></label>
      <label>Content <select name="videoType"><option value="all">All</option><option value="video">Videos</option><option value="short">Shorts</option><option value="broadcast">Live and recorded</option></select></label>
      <label>Language <select name="videoLanguage"><option value="all">All</option><option value="en">English</option><option value="hi">हिंदी</option></select></label>
      <label>Playlist <select name="videoPlaylist"><option value="">All playlists</option></select></label>
    </div>
    <div class="catalog-playlist" data-playlist-info hidden></div>
    <p class="media-meta" data-catalog-status role="status">Loading videos…</p>
    <div class="media-grid" id="videoList"></div>
    <button type="button" class="btn btn-ghost catalog-more" data-catalog-more hidden>Load more</button>
  </div>
</section>

<footer>
  <div class="container footer-grid">
    <div>© Cashly by VKS Tech</div>
    <div class="footer-links">
      <a href="blog.html">Blog</a>
      <a href="calculators.html">Calculators</a>
      <a href="app/">App</a>
      <a href="https://www.youtube.com/@cashlybyVks" target="_blank" rel="noopener">YouTube</a>
    </div>
  </div>
</footer>
<dialog id="cashly-video-player" class="catalog-player" aria-labelledby="catalog-player-title">
  <form method="dialog"><button type="submit" class="btn btn-ghost">Close</button></form>
  <h2 id="catalog-player-title">Video</h2>
  <div data-player></div>
  <p>If playback is unavailable here, <a target="_blank" rel="noopener noreferrer">open in YouTube</a>.</p>
</dialog>
<script src="app/js/video-catalog.js"></script>
<script src="js/youtube.js"></script>
<script>CashlyYT.renderInto(document.getElementById('videoList'));</script>
</body>
</html>
